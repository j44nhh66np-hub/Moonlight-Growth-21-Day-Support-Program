const list = document.getElementById('list');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const state = days.map(()=>({open:false, done:false}));

function render(){
  list.innerHTML = '';
  days.forEach((day, i)=>{
    const s = state[i];
    const card = document.createElement('div');
    card.className = 'card' + (s.open ? ' open' : '') + (s.done ? ' done' : '') + (day.launch ? ' launch' : '');
    card.innerHTML = `
      <div class="card-head" data-idx="${i}">
        <div class="date-badge">
          <div class="d">${day.date}</div>
          <div class="w">週${day.weekday}</div>
        </div>
        <div class="head-text">
          <div class="phase-tag">${day.phase}</div>
          <div class="title">${day.title}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="card-body">
        <div class="body-inner">
          <div class="copy-box">${day.text}</div>
          ${day.note ? `<div class="note">${day.note}</div>` : ''}
          <div class="actions">
            <button class="copy-btn" data-copy="${i}">複製文案</button>
            <button class="done-btn" data-done="${i}">${s.done ? '已發送 ✓' : '今天發過了'}</button>
          </div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.card-head').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = +el.dataset.idx;
      state[idx].open = !state[idx].open;
      render();
    });
  });

  list.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = +btn.dataset.copy;
      navigator.clipboard.writeText(days[idx].text).then(()=>{
        btn.textContent = '已複製 ✓';
        btn.classList.add('copied');
        setTimeout(()=>{ btn.textContent = '複製文案'; btn.classList.remove('copied'); }, 1600);
      }).catch(()=>{ btn.textContent = '請手動選取複製'; });
    });
  });

  list.querySelectorAll('[data-done]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = +btn.dataset.done;
      state[idx].done = !state[idx].done;
      render();
      updateProgress();
    });
  });

  updateProgress();
}

function updateProgress(){
  const doneCount = state.filter(s=>s.done).length;
  progressText.textContent = `${doneCount} / ${days.length}`;
  progressFill.style.width = (doneCount / days.length * 100) + '%';
}

function renderKb(){
  const kbList = document.getElementById('kbList');
  kbList.innerHTML = '';
  kb.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'kb-card';
    let rowsHtml = item.rows.map(r=>`<div class="kb-row"><b>${r[0]}：</b>${r[1]}</div>`).join('');
    let quoteHtml = item.quote ? `<div class="kb-quote">${item.quote.replace(/\n/g,'<br>')}</div>` : '';
    card.innerHTML = `
      <div class="kb-name">${item.name}</div>
      <div class="kb-row"><b>類型：</b>${item.type}</div>
      ${rowsHtml}
      ${quoteHtml}
      <div class="note">⚠️ ${item.warn}</div>
    `;
    kbList.appendChild(card);
  });
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});
